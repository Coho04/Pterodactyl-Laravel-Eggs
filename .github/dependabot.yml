# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
  # The Dockerfiles live in 11/php_XX/, one per PHP version, not in the repository root.
  - package-ecosystem: "docker"
    directories:
      - "/11/*"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
    # Each folder pins one PHP line on purpose (php_82 = 8.2, ...); moving to a newer PHP
    # version is a new image, not an update. Base image patches arrive through the monthly
    # rebuild in laravel.yml.
    ignore:
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
